name: CampaignMosaic Daily Report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_report.yml'
      - 'campaign_mosaic/**'
      - 'config.example.yaml'
      - 'webui/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy config and run
        run: |
          cp config.example.yaml config.yaml
          python -m campaign_mosaic.main --config config.yaml
        env:
          YOUZAN_API_KEY: ${{ secrets.YOUZAN_API_KEY }}
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
          JULIANG_ACCOUNT_ID: ${{ secrets.JULIANG_ACCOUNT_ID }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}

      - name: Setup Pages structure
        run: |
          mkdir -p pages/report
          cp -r webui/* pages/ 2>/dev/null || true
          if [ -d "reports" ]; then
            cp reports/*.html pages/report/ 2>/dev/null || true
            LATEST_REPORT=$(ls -t reports/report_*.html 2>/dev/null | head -n1)
            if [ -n "$LATEST_REPORT" ]; then
              cp "$LATEST_REPORT" pages/report/index.html
            fi
          fi
          echo "Pages structure:" && find pages -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
