name: CampaignMosaic Daily Report

on:
  schedule:
    # 每天 UTC 时间 01:00 执行（北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy config and set environment variables
        run: |
          cp config.example.yaml config.yaml
        env:
          YOUZAN_API_KEY: ${{ secrets.YOUZAN_API_KEY }}
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
          JULIANG_ACCOUNT_ID: ${{ secrets.JULIANG_ACCOUNT_ID }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          DINGTALK_BOT_WEBHOOK: ${{ secrets.DINGTALK_BOT_WEBHOOK }}
          DINGTALK_BOT_SECRET: ${{ secrets.DINGTALK_BOT_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Run CampaignMosaic
        run: |
          python -m campaign_mosaic.main --config config.yaml
        env:
          YOUZAN_API_KEY: ${{ secrets.YOUZAN_API_KEY }}
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
          JULIANG_ACCOUNT_ID: ${{ secrets.JULIANG_ACCOUNT_ID }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          DINGTALK_BOT_WEBHOOK: ${{ secrets.DINGTALK_BOT_WEBHOOK }}
          DINGTALK_BOT_SECRET: ${{ secrets.DINGTALK_BOT_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: ./reports/
          retention-days: 30
